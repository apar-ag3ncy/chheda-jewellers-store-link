<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b3a2d" />
    <title>Chheda Jewellers - Store Visit-Link</title>
    <meta name="description" content="We look forward to your visit. Find your way to Chheda Jewellers in Vile Parle or Ghatkopar with directions on Google Maps." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Chheda Jewellers" />
    <meta property="og:title" content="Chheda Jewellers - Store Visit-Link" />
    <meta property="og:description" content="A warm welcome awaits. Choose our Vile Parle or Ghatkopar store for directions." />
    <meta property="og:image" content="/assets/social-preview.jpg" />
    <meta property="og:image:alt" content="Chheda Jewellers" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="./assets/chheda-monogram.svg" type="image/svg+xml" />
    <link rel="preload" href="./assets/fonts/CormorantInfant-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="./assets/fonts/Montserrat-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="decoration" aria-hidden="true">
      <div class="page-frame"></div>
      <div class="ornament ornament--left"></div>
      <div class="ornament ornament--right"></div>
    </div>

    <main class="invitation">
      <header class="brand">
        <img class="brand__logo" src="./assets/chheda-logo.png" alt="Chheda Jewellers" width="1600" height="487" fetchpriority="high" />
      </header>

      <div class="flourish" aria-hidden="true"><span></span><i></i><span></span></div>

      <section class="welcome" aria-labelledby="welcome-title">
        <p class="eyebrow">AN INVITATION TO VISIT</p>
        <h1 id="welcome-title">We look forward<br />to <em>your visit.</em></h1>
        <p class="welcome__note">Discover something special, in person.</p>

        <nav class="stores" aria-label="Choose a Chheda Jewellers store">
          <a class="store-link" href="https://www.google.com/maps/search/?api=1&amp;query=Chheda+Jewellers+Trinity+Square+Vile+Parle+East" target="_blank" rel="noopener noreferrer" aria-label="Vile Parle store — get directions on Google Maps (opens in a new tab)">
            <span class="store-link__pin" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M19 10c0 5-7 11-7 11S5 15 5 10a7 7 0 1 1 14 0Z" /><circle cx="12" cy="10" r="2.4" /></svg>
            </span>
            <span class="store-link__copy"><span class="store-link__name">Vile Parle</span><span class="store-link__action">GET DIRECTIONS</span></span>
            <span class="store-link__arrow" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 18 18 6M6 6h12v12" /></svg></span>
          </a>

          <a class="store-link" href="https://www.google.com/maps/search/?api=1&amp;query=Chheda+Jewellers+Vardhaman+Business+Bay+Vallabh+Baug+Lane+Ghatkopar+East" target="_blank" rel="noopener noreferrer" aria-label="Ghatkopar store — get directions on Google Maps (opens in a new tab)">
            <span class="store-link__pin" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M19 10c0 5-7 11-7 11S5 15 5 10a7 7 0 1 1 14 0Z" /><circle cx="12" cy="10" r="2.4" /></svg>
            </span>
            <span class="store-link__copy"><span class="store-link__name">Ghatkopar</span><span class="store-link__action">GET DIRECTIONS</span></span>
            <span class="store-link__arrow" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 18 18 6M6 6h12v12" /></svg></span>
          </a>
        </nav>
        <p class="map-note">Choose your store. Let Google Maps guide you.</p>
      </section>

      <footer class="signature"><span></span><p>CHHEDA JEWELLERS <b aria-hidden="true">·</b> MUMBAI</p><span></span></footer>
    </main>
  </body>
</html>
