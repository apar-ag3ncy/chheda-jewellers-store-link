<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b3a2d" />
    <title>Chheda Jewellers - Store Visit-Link</title>
    <meta name="description" content="We look forward to your visit. Find your way to Chheda Jewellers in Vile Parle East or Ghatkopar East with directions on Google Maps." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Chheda Jewellers" />
    <meta property="og:title" content="Chheda Jewellers - Store Visit-Link" />
    <meta property="og:description" content="A warm welcome awaits. Choose our Vile Parle East or Ghatkopar East store for directions." />
    <meta property="og:image" content="/assets/social-preview.jpg" />
    <meta property="og:image:alt" content="Chheda Jewellers" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="./assets/chheda-monogram.svg" type="image/svg+xml" />
    <link rel="preload" href="./assets/fonts/CormorantInfant-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="./assets/fonts/Montserrat-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="./assets/intro-monogram.png" as="image" />
    <script>
      // The page stays usable if JavaScript or the animation library fails.
      if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        document.documentElement.dataset.intro = 'pending';
        window.chhedaIntroTimeout = window.setTimeout(function () {
          document.documentElement.removeAttribute('data-intro');
          document.querySelector('.invitation')?.removeAttribute('inert');
          window.dispatchEvent(new Event('chheda:intro-timeout'));
        }, 4500);
      }
    </script>
    <link rel="stylesheet" href="./styles.css" />
    <script src="./assets/vendor/gsap.min.js" defer></script>
    <script src="./intro.js" defer></script>
  </head>
  <body>
    <section class="intro" aria-label="Welcome to Chheda Jewellers">
      <div class="intro__veil" aria-hidden="true"></div>
      <div class="intro__stage">
        <div class="intro__mark">
          <img class="intro__monogram" src="./assets/intro-monogram.png" alt="Chheda Jewellers monogram" width="643" height="658" fetchpriority="high" />
        </div>
        <div class="intro__copy" aria-hidden="true">
          <p>CHHEDA JEWELLERS</p>
        </div>
      </div>
      <button class="intro__skip" type="button">Skip intro <span aria-hidden="true">↗</span></button>
    </section>

    <div class="decoration" aria-hidden="true">
      <div class="page-frame"></div>
      <div class="ornament ornament--left"></div>
      <div class="ornament ornament--right"></div>
    </div>

    <main class="invitation">
      <header class="brand">
        <img class="brand__logo" src="./assets/chheda-logo.png" alt="Chheda Jewellers" width="1600" height="487" fetchpriority="high" />
      </header>

      <div class="flourish" aria-hidden="true"><span></span><i></i><span></span></div>

      <section class="welcome" aria-labelledby="welcome-title">
        <h1 id="welcome-title" tabindex="-1">Visit our <em>stores.</em></h1>

        <nav class="stores" aria-label="Choose a Chheda Jewellers store">
          <a class="store-link" href="https://www.google.com/maps/search/?api=1&amp;query=Chheda+Jewellers+Trinity+Square+Vile+Parle+East" target="_blank" rel="noopener noreferrer" aria-label="Vile Parle East store — get directions on Google Maps (opens in a new tab)">
            <span class="store-link__pin" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M19 10c0 5-7 11-7 11S5 15 5 10a7 7 0 1 1 14 0Z" /><circle cx="12" cy="10" r="2.4" /></svg>
            </span>
            <span class="store-link__copy"><span class="store-link__name">VILE PARLE -(E)</span><span class="store-link__action">GET DIRECTIONS</span></span>
            <span class="store-link__arrow" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 18 18 6M6 6h12v12" /></svg></span>
          </a>

          <a class="store-link" href="https://www.google.com/maps/search/?api=1&amp;query=Chheda+Jewellers+Vardhaman+Business+Bay+Vallabh+Baug+Lane+Ghatkopar+East" target="_blank" rel="noopener noreferrer" aria-label="Ghatkopar East store — get directions on Google Maps (opens in a new tab)">
            <span class="store-link__pin" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M19 10c0 5-7 11-7 11S5 15 5 10a7 7 0 1 1 14 0Z" /><circle cx="12" cy="10" r="2.4" /></svg>
            </span>
            <span class="store-link__copy"><span class="store-link__name">GHAT KOPAR -(E)</span><span class="store-link__action">GET DIRECTIONS</span></span>
            <span class="store-link__arrow" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 18 18 6M6 6h12v12" /></svg></span>
          </a>
        </nav>
      </section>

      <footer class="signature"><span></span><p>MUMBAI</p><span></span></footer>
    </main>
  </body>
</html>
